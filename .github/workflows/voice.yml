name: Voice

# Records every story of the newest edition in both newsreader voices (Kokoro, free and
# open-source), after each edition is loaded. Re-runs only fill gaps. Needs the same two
# secrets as Load edition: SUPABASE_URL and SUPABASE_SERVICE_ROLE_KEY.

on:
  workflow_run:
    workflows: ['Load edition']
    types: [completed]
  workflow_dispatch:

concurrency:
  group: voice
  cancel-in-progress: false

jobs:
  record:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        reader: [george, emma]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: scripts/voice/requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: kokoro-82m-v1
      - run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
      # CPU-only torch: a fraction of the download of the default build
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q -r scripts/voice/requirements.txt
      - name: Record
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python scripts/voice/record.py ${{ matrix.reader }}
