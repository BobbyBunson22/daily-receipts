name: Fetch feeds

# Each morning before the 05:49 edition, reads the outlets in data/feeds.json and publishes
# today's shortlist (headlines and links, grouped into stories) as latest.json on the
# `feeds` branch, which holds only that one file and its README. Run by hand from the Actions tab too.

on:
  schedule:
    - cron: '35 3 * * *' # 04:35 BST / 03:35 GMT, comfortably before 05:49 London time
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fetch-feeds
  cancel-in-progress: true

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Read the feeds
        run: npx tsx scripts/fetch-feeds.ts out/latest.json | tee out-summary.txt
      - name: Publish to the feeds branch
        run: |
          cd out
          printf '# Feeds\n\nMade by the "Fetch feeds" Action on main. `latest.json` is today'"'"'s shortlist for the morning edition.\n\n```\n' > README.md
          cat ../out-summary.txt >> README.md
          printf '```\n' >> README.md
          git init -q -b feeds
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add latest.json README.md
          git commit -q -m "Feeds $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" feeds
