name: Voice sample

# Records sample clips with Kokoro (free, open-source voices) so voices can be compared by ear.
# Run by hand from the Actions tab; the clips are attached to the run as "voice-samples".

on:
  workflow_dispatch:
    inputs:
      edition:
        description: 'Edition file'
        required: true
        default: 'data/edition-2026-10-20.json'
      stories:
        description: 'Story ids, space separated'
        required: true
        default: 'uk-bus-music-fines sci-mmx-phobos sp-spurs-coventry'
      openings:
        description: 'Record the two-handed opening instead'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q -r scripts/voice/requirements.txt
      - run: python scripts/voice/kokoro_sample.py "${{ inputs.edition }}" out ${{ inputs.stories }}
        if: ${{ !inputs.openings }}
      - run: python scripts/voice/openings_sample.py out
        if: ${{ inputs.openings }}
      - uses: actions/upload-artifact@v4
        with:
          name: voice-samples
          path: out/*.mp3
      # also kept on the voice-samples branch (never deployed), for anyone who can't reach artifacts
      - run: |
          cd out
          git init -q -b voice-samples
          git -c user.name=github-actions -c user.email=actions@github.com add *.mp3
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Voice samples"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voice-samples
