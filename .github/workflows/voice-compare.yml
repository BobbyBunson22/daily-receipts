name: Voice compare

# Records two stories four ways (see scripts/voice/compare.py) and puts the clips on the
# voice-samples branch (never deployed). Run by hand.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  kokoro:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -q && sudo apt-get install -y -q espeak-ng ffmpeg
      - run: pip install -q torch --index-url https://download.pytorch.org/whl/cpu && pip install -q -r scripts/voice/requirements.txt
      - run: python -m unittest discover -s scripts/voice
      - run: python scripts/voice/compare.py kokoro out
      - uses: actions/upload-artifact@v4
        with:
          name: kokoro
          path: out/

  chatterbox:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: sudo apt-get update -q && sudo apt-get install -y -q ffmpeg
      - run: pip install -q chatterbox-tts soundfile
      # 15 seconds of George, recorded this morning by Kokoro (Apache 2.0), as the voice to copy
      - run: |
          curl -sSfL -o george.mp3 "https://klgaxxuwiyurosrawplr.supabase.co/storage/v1/object/public/voice/kokoro/2026-10-20/george/uk-bus-music-fines.mp3"
          ffmpeg -loglevel error -y -i george.mp3 -t 15 -ac 1 -ar 24000 ref.wav
      - run: python scripts/voice/compare.py chatterbox out ref.wav
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: chatterbox
          path: out/

  publish:
    needs: [kokoro, chatterbox]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - run: |
          cd out && ls -la
          git init -q -b voice-samples
          git -c user.name=github-actions -c user.email=actions@github.com add -A
          git -c user.name=github-actions -c user.email=actions@github.com commit -q -m "Voice comparison"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" voice-samples
