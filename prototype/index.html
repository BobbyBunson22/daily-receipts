<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#faf9f5;color:#141413}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Daily Receipts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,500..800&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=IBM+Plex+Mono:wght@400;600&display=swap">
<style>
/* Layout: white receipt slips stacked on a deep navy frame. One slip per section in Scroll mode; one clean card per story in Swipe mode.
   Deliberately one look in both themes: navy frame, paper slips, navy and ink type. */
:root{
  --navy:#0d1836; --navy-2:#18264f; --navy-3:#24345f;
  --on-navy:#ffffff; --on-navy-2:#a9b3d3;
  --paper:#fcfbf8; --paper-2:#f2f0ea; --ink:#15171c; --ink-2:#5c616e; --line:#e3e0d8; --dash:#c8c4ba;
  --cut:#b23a26; --scrim:rgba(5,9,25,.6); --shadow:rgba(0,0,0,.35);
  --f-disp:"Bricolage Grotesque","Arial Narrow",system-ui,sans-serif;
  --f-body:"Newsreader",Georgia,"Times New Roman",serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{background:var(--navy);color:var(--ink)}
body{font-family:var(--f-body);font-size:17px;line-height:1.5;padding-inline:16px;padding-block:0 48px}
body.locked{overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{opacity:.35;cursor:default}
:focus-visible{outline:3px solid #8fb0ff;outline-offset:2px}
a{color:inherit}
.wrap{max-width:600px;margin:0 auto}
.muted{color:var(--ink-2);font-size:15px;margin:4px 0 10px}

/* logo: the torn slip */
.drlogo{width:30px;height:38px;flex:none;display:block;overflow:visible}
.drlogo .lg-body{fill:var(--navy)}
.drlogo .lg-txt{fill:var(--paper);font-family:var(--f-disp);font-weight:800;font-stretch:75%;font-size:50px;letter-spacing:-1px}
.drlogo .lg-dash{stroke:var(--paper);stroke-width:3;stroke-dasharray:5 4}
.drlogo .lg-tick{fill:none;stroke:var(--paper);stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.drlogo.inv .lg-body{fill:var(--paper)}
.drlogo.inv .lg-txt{fill:var(--navy)}
.drlogo.inv .lg-dash,.drlogo.inv .lg-tick{stroke:var(--navy)}
.chead .drlogo{width:26px;height:33px}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;margin-inline:-16px;padding:12px 16px;background:var(--navy);border-bottom:1px solid var(--navy-3)}
.top-in{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0;display:flex;align-items:center;gap:10px;color:var(--on-navy)}
.word{position:relative;font-family:var(--f-disp);font-weight:800;font-size:clamp(20px,5.4vw,25px);letter-spacing:-.04em;line-height:1;white-space:nowrap;padding-bottom:8px}
.word::after{content:"";position:absolute;left:0;right:0;bottom:0;height:6px;background:linear-gradient(-45deg,transparent 4px,currentColor 0) 0 0/8px 6px repeat-x,linear-gradient(45deg,transparent 4px,currentColor 0) 0 0/8px 6px repeat-x}
.modes{display:inline-flex;border:1px solid var(--navy-3);border-radius:999px;padding:3px;flex:none}
.modes button{border:0;background:none;color:var(--on-navy-2);padding:6px 13px;border-radius:999px;font-family:var(--f-mono);font-weight:600;font-size:12.5px;letter-spacing:.04em;text-transform:uppercase}
.modes button[aria-pressed="true"]{background:var(--paper);color:var(--navy)}
.icon-btn{width:36px;height:36px;flex:none;border-radius:50%;border:1px solid var(--navy-3);background:none;color:var(--on-navy);display:grid;place-items:center}
.progress{position:absolute;left:0;right:0;bottom:-1px;height:2px}
.progress i{display:block;height:100%;width:0;background:var(--on-navy);transition:width .15s linear}

/* intro on the navy frame */
.intro{color:var(--on-navy);padding:28px 2px 22px}
.intro .date{font-family:var(--f-mono);font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--on-navy-2)}
.intro h1{font-family:var(--f-disp);font-size:clamp(34px,9.5vw,54px);line-height:1;font-weight:800;letter-spacing:-.035em;margin:10px 0 12px;text-wrap:balance}
.intro h1 span{color:var(--on-navy-2)}
.intro p{margin:0;font-size:18px;color:var(--on-navy-2)}
.stats{display:flex;gap:6px 16px;flex-wrap:wrap;margin-top:16px;font-family:var(--f-mono);font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--on-navy-2)}
.stats span::before{content:"— ";opacity:.6}
.stats .hot{color:var(--on-navy)}

/* receipt slips */
.rcpt{position:relative;background:var(--paper);margin-bottom:34px;box-shadow:0 10px 30px var(--shadow)}
.rcpt::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:linear-gradient(-45deg,transparent 7px,var(--paper) 0) 0 0/14px 10px repeat-x,linear-gradient(45deg,transparent 7px,var(--paper) 0) 0 0/14px 10px repeat-x}
.band{display:flex;align-items:baseline;justify-content:space-between;gap:10px;padding:18px 22px 12px;border-bottom:1.5px dashed var(--dash);font-family:var(--f-mono);text-transform:uppercase;letter-spacing:.1em}
.band h2{margin:0;font-size:13px;font-weight:600;color:var(--navy)}
.band span{font-size:12px;color:var(--ink-2)}
.between{text-align:center;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--on-navy-2);margin:-10px 0 30px}
.item{padding:18px 22px 20px}
.item + .item{border-top:1px solid var(--line)}
.meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.meta .grade{margin-left:auto}
.why{text-transform:none;letter-spacing:0;color:var(--navy);font-weight:600}
.grade{display:inline-grid;place-items:center;min-width:24px;height:22px;padding:0 6px;border-radius:4px;font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:0}
.gA{background:var(--navy);color:var(--on-navy)}
.gB{background:var(--navy-3);color:var(--on-navy)}
.gC{border:1.5px solid var(--ink-2);color:var(--ink-2)}
.gD{border:1.5px solid var(--cut);color:var(--cut)}
.item h3{margin:8px 0 12px;font-family:var(--f-disp);font-size:23px;line-height:1.15;font-weight:800;letter-spacing:-.02em;color:var(--navy);text-wrap:balance}
.hl{all:unset;cursor:pointer}
.hl:hover{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.hl:focus-visible{outline:3px solid #8fb0ff;outline-offset:2px;border-radius:3px}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.facts li{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;font-size:17px;line-height:1.38}
.facts small{display:block;font-family:var(--f-mono);font-size:11px;letter-spacing:.03em;color:var(--ink-2);margin-top:2px}
.tick{width:18px;height:18px;border-radius:50%;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;margin-top:3px}
.tick svg{width:11px;height:11px}
.total{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:14px;padding-top:10px;border-top:1.5px dashed var(--dash);font-family:var(--f-mono);font-size:11.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.total span:last-child{margin-left:auto;color:var(--navy);font-weight:600}
.cutn{color:var(--cut);text-decoration:line-through}
.actions{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--navy);background:var(--paper);color:var(--navy);border-radius:999px;padding:6px 14px;font-family:var(--f-disp);font-size:14px;font-weight:700;text-decoration:none}
.pill:hover,.pill.solid,.pill[aria-pressed="true"]{background:var(--navy);color:var(--on-navy)}
.react{margin-left:auto;display:flex;gap:6px}
.rb{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);color:var(--ink-2);display:grid;place-items:center}
.rb:hover{border-color:var(--navy);color:var(--navy)}
.rb.up[aria-pressed="true"]{background:var(--navy);border-color:var(--navy);color:var(--on-navy)}
.rb.down[aria-pressed="true"]{background:var(--ink-2);border-color:var(--ink-2);color:var(--paper)}
.secmore{display:block;width:100%;border:0;border-top:1.5px dashed var(--dash);background:none;color:var(--navy);padding:14px;font-family:var(--f-mono);font-weight:600;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase}
.end{padding:30px 22px 14px;text-align:center}
.end .drlogo{width:46px;height:58px;margin:0 auto 14px}
.end h2{font-family:var(--f-disp);font-size:28px;font-weight:800;letter-spacing:-.025em;color:var(--navy);margin:0 0 6px}
.end p{margin:0 0 6px;color:var(--ink-2)}
.endbtns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:12px}

/* feedback */
.feedback{padding:18px 22px 28px;border-top:1.5px dashed var(--dash);margin-top:16px}
.feedback h2{font-family:var(--f-disp);font-size:19px;font-weight:800;color:var(--navy);margin:0}
.fbq{border:0;margin:0;padding:10px 0;min-width:0}
.fbq legend{font-weight:600;font-size:16px;padding:0;margin-bottom:8px}
.fbopts{display:flex;flex-wrap:wrap;gap:8px}
.fbopts label{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--line);border-radius:999px;padding:5px 12px;cursor:pointer;font-family:var(--f-disp);font-size:14px;font-weight:600}
.fbopts label:has(input:checked){border-color:var(--navy);background:var(--paper-2)}
.fbopts input{accent-color:var(--navy);margin:0}
.fbq textarea{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:10px;resize:vertical}
.fbfoot{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:10px}

/* swipe */
.deckwrap{max-width:420px;margin:8px auto 0}
.dcount{color:var(--on-navy-2);text-align:center;font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;margin:8px 0 14px}
.deck{position:relative;height:min(64vh,560px);min-height:450px}
.card{position:absolute;inset:0 0 10px;background:var(--paper);border-radius:14px 14px 0 0;padding:20px 22px 0;box-shadow:0 18px 40px var(--shadow);display:flex;flex-direction:column;touch-action:pan-y;user-select:none;-webkit-user-select:none;cursor:grab}
.card::after{content:"";position:absolute;left:0;right:0;bottom:-10px;height:10px;background:linear-gradient(-45deg,transparent 7px,var(--paper) 0) 0 0/14px 10px repeat-x,linear-gradient(45deg,transparent 7px,var(--paper) 0) 0 0/14px 10px repeat-x}
.card.d1{transform:translateY(12px) scale(.95);filter:brightness(.93);pointer-events:none}
.card.d2{transform:translateY(24px) scale(.9);filter:brightness(.86);pointer-events:none}
.cin{flex:1;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:12px}
.chead{display:flex;align-items:center;gap:10px;padding-bottom:12px;border-bottom:1.5px dashed var(--dash);font-family:var(--f-mono);font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-2)}
.chead .grade{margin-left:auto}
.card h3{margin:0;font-family:var(--f-disp);font-size:clamp(20px,5.4vw,24px);line-height:1.12;font-weight:800;letter-spacing:-.02em;color:var(--navy);text-wrap:balance;overflow-wrap:break-word}
.card.tight .cstand{display:none}
.cstand{margin:0;font-size:16px;font-style:italic;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card .facts li{font-size:16px}
.cardfoot{display:flex;justify-content:space-between;gap:10px;padding:12px 0 16px;margin-top:10px;border-top:1.5px dashed var(--dash);font-family:var(--f-mono);font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.stamp{position:absolute;top:66px;z-index:2;padding:2px 10px;border:3px solid currentColor;border-radius:6px;font-family:var(--f-mono);font-weight:600;font-size:20px;letter-spacing:.1em;opacity:0;pointer-events:none;background:var(--paper)}
.stamp.more{right:18px;color:var(--navy);transform:rotate(8deg)}
.stamp.less{left:18px;color:var(--cut);transform:rotate(-8deg)}
.dbtns{display:flex;justify-content:center;align-items:center;gap:18px;margin-top:24px}
.dbtn{width:62px;height:62px;border-radius:50%;border:1.5px solid var(--navy-3);background:var(--navy-2);color:var(--on-navy);display:grid;place-items:center}
.dbtn.love{background:var(--paper);color:var(--navy);border-color:var(--paper)}
.dbtn.small{width:46px;height:46px}
.hint{color:var(--on-navy-2);text-align:center;font-size:15px;margin:16px 0 0}

/* sheets */
.scrim{position:fixed;inset:0;background:var(--scrim);z-index:30}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(660px,100%);max-height:90vh;overflow:auto;overscroll-behavior:contain;background:var(--paper);border-radius:16px 16px 0 0;z-index:31;padding:22px 22px calc(30px + env(safe-area-inset-bottom,0px))}
.xbtn{position:sticky;top:0;float:right;width:36px;height:36px;border-radius:50%;border:0;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;margin:-6px -6px 0 8px;z-index:1}
.sh-title{font-family:var(--f-disp);font-size:clamp(25px,6vw,31px);line-height:1.1;font-weight:800;letter-spacing:-.025em;color:var(--navy);margin:10px 0 8px;text-wrap:balance}
.stand{font-size:18px;font-style:italic;color:var(--ink-2);margin:0 0 12px}
.sheet h4{font-family:var(--f-mono);font-size:12px;letter-spacing:.1em;text-transform:uppercase;font-weight:600;margin:24px 0 10px;padding-bottom:6px;border-bottom:1.5px dashed var(--dash);color:var(--navy)}
.body p{font-size:17.5px;line-height:1.65;margin:0 0 12px;max-width:65ch}
.body{margin-top:16px}
.cutlist,.plain,.srcs{list-style:none;margin:0;padding:0}
.cutlist li,.plain li,.srcs li{padding:9px 0;border-bottom:1px solid var(--line);font-size:16px}
.cutlist s{text-decoration-color:var(--cut);text-decoration-thickness:2px;color:var(--ink-2)}
.cutlist span{display:block;font-family:var(--f-mono);font-size:11.5px;letter-spacing:.03em;color:var(--cut);margin-top:3px}
.srcs li{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.srcs a{font-weight:600;color:var(--navy);text-underline-offset:3px}
.srcs em{font-size:13px;color:var(--ink-2)}
.srcs span{margin-left:auto;font-family:var(--f-mono);font-size:11.5px;color:var(--ink-2)}
.gradebox{border:1.5px solid var(--navy);border-radius:10px;padding:14px 16px;margin-top:24px}
.gb-head{display:flex;align-items:center;gap:10px;font-family:var(--f-disp);color:var(--navy)}
.gb-head span{margin-left:auto;font-family:var(--f-mono);font-weight:600}
.gradebox p{font-size:15px;color:var(--ink-2);margin:8px 0 10px}
.meters{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 16px}
.meter span{font-family:var(--f-mono);font-size:11px;letter-spacing:.03em;color:var(--ink-2)}
.meter i,.lrow i{display:block;height:5px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:4px}
.meter b,.lrow b{display:block;height:100%;background:var(--navy);border-radius:3px}
.sh-react{display:flex;align-items:center;gap:8px;margin-top:24px;padding-top:14px;border-top:1.5px dashed var(--dash);font-family:var(--f-disp);font-weight:700;color:var(--navy)}
.sh-react span{margin-right:auto}
.srow{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.srow .num{width:24px;font-family:var(--f-mono);font-weight:600;font-size:15px;text-align:right;color:var(--navy)}
.srow .nm{flex:1;font-family:var(--f-disp);font-weight:700;font-size:17px}
.mv{width:34px;height:34px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);font-size:15px}
.addrow{display:flex;flex-wrap:wrap;gap:8px}
.learned{display:grid;gap:8px;margin-bottom:12px}
.lrow{display:grid;grid-template-columns:110px minmax(0,1fr) 44px;align-items:center;gap:10px;font-family:var(--f-disp);font-size:15px;font-weight:600}
.lrow i{margin-top:0}
.lrow i.neg b{background:var(--ink-2)}
.lrow em{font-style:normal;font-family:var(--f-mono);font-size:11px;color:var(--ink-2)}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);background:var(--paper);color:var(--navy);padding:10px 16px;border-radius:999px;font-family:var(--f-disp);font-weight:700;font-size:15px;box-shadow:0 8px 24px var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:40;white-space:nowrap;max-width:calc(100vw - 32px);overflow:hidden;text-overflow:ellipsis}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (max-width:480px){.modes button{padding:6px 10px}.meters{grid-template-columns:minmax(0,1fr)}.react{margin-left:0}.word{font-size:19px}}
@media (max-width:420px){.word{font-size:17px}.modes button{padding:6px 9px;font-size:11.5px}.brand{gap:8px}.top-in{gap:8px}}
@media (max-width:370px){.word{display:none}}
.cardfoot{flex-wrap:wrap}.cardfoot > span{white-space:nowrap}
@media (max-height:700px){.cstand{display:none}.cin{gap:8px}.card{padding:14px 18px 0}.chead{padding-bottom:8px}.card .facts{gap:6px}.card .facts li{font-size:15px;line-height:1.3}.cardfoot{padding:8px 0 12px;margin-top:6px}.dcount{margin:4px 0 8px}.dbtns{margin-top:18px}.hint{display:none}.deck{min-height:430px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* first-visit guide */
.coach{position:fixed;inset:0;z-index:50}
.coach-spot{position:fixed;border-radius:50%;box-shadow:0 0 0 9999px rgba(5,9,25,.74);outline:3px solid var(--paper);outline-offset:3px;pointer-events:none;animation:coachpulse 1.6s ease-in-out infinite}
@keyframes coachpulse{50%{outline-offset:8px}}
.coach-hit{position:fixed;border:0;border-radius:50%;background:transparent;cursor:pointer}
.coach-tip{position:fixed;right:16px;width:min(330px,calc(100vw - 32px));background:var(--paper);border-radius:14px;padding:18px 18px 16px;box-shadow:0 16px 40px var(--shadow)}
.coach-tip::before{content:"";position:absolute;top:-8px;left:var(--ax,80%);width:16px;height:16px;background:var(--paper);transform:rotate(45deg);border-radius:3px}
.coach-head{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.coach-head .drlogo{width:26px;height:33px}
.coach-head b{font-family:var(--f-disp);font-weight:800;font-size:20px;letter-spacing:-.02em;color:var(--navy);line-height:1.1}
.coach-steps{list-style:none;margin:0 0 14px;padding:0;display:grid;gap:10px}
.coach-steps li{display:grid;grid-template-columns:24px minmax(0,1fr);gap:10px;font-size:16px;line-height:1.35}
.coach-steps span{width:24px;height:24px;border-radius:50%;background:var(--navy);color:var(--on-navy);display:grid;place-items:center;font-family:var(--f-mono);font-weight:600;font-size:12px}
.coach-btns{display:flex;gap:8px;flex-wrap:wrap}
@media (prefers-reduced-motion:reduce){.coach-spot{animation:none}}

/* roundup + bulletin */
.dtop{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:8px 0 14px}
.dtop .dcount{margin:0;text-align:left}
.rpill{border:1px solid var(--navy-3);background:var(--navy-2);color:var(--on-navy);border-radius:999px;padding:6px 12px;font-family:var(--f-mono);font-weight:600;font-size:12px;letter-spacing:.05em;text-transform:uppercase;white-space:nowrap}
.rpill:hover{background:var(--navy-3)}
.introbtn{margin:16px 0 0}
.player{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:14px;border:1.5px solid var(--navy);border-radius:12px;margin:6px 0 4px}

 head:"German factory orders drop 10.6% in August",
 stand:"New orders fell far more than expected as large domestic contracts, including defence and transport equipment, unwound after a strong July.",
 body:["Orders for German factories fell 10.6% in August from July, the Federal Statistics Office said. Economists had expected a drop of about 1%.","The fall was driven by fewer large domestic orders. Orders for military vehicles, aircraft, ships and trains dropped by more than 60%.","Excluding large orders, the level was almost unchanged from July. Over June to August, orders were 1.3% higher than in the previous three months.","July's increase was revised up to 3.2%. The economy ministry called August a marked setback but said public procurement makes orders highly volatile."],

 stand:"The gap between US imports and exports grew 13.7% in August, more than economists expected, as goods imports rose sharply.",
 body:["The US trade deficit in goods and services rose to $105.6bn in August, official data showed on Tuesday. That was up $12.7bn from a revised $92.8bn in July.","Imports climbed 4.3% to $420.8bn, while exports rose 1.4% to $315.2bn. Economists had forecast a deficit of about $102bn.","The Korea Times, citing economists, linked the import rise to strong consumer spending and business investment in equipment, including for AI.","For the year to date, the deficit is about 20% smaller than in the same period of 2025, the official release said."],

{id:"sci-nobel-physics-halzen",
 sec:"science",
 sub:"Physics",
 head:"Physics Nobel goes to Francis Halzen for IceCube neutrino discovery",
 say:"This year's Nobel Prize in Physics goes to just one person, Francis Halzen. The 82-year-old is honoured for IceCube, which found high-energy neutrinos arriving from deep space.",
 stand:"The Belgian-born physicist is the sole winner, honoured for turning Antarctic ice into a detector for neutrinos arriving from deep space.",
 body:["The Royal Swedish Academy of Sciences awarded the 2026 Nobel Prize in Physics to Francis Halzen on Tuesday. He is a professor at the University of Wisconsin–Madison and was born in Belgium.","The citation recognises his decisive contributions to the IceCube Neutrino Observatory and the discovery of high-energy neutrinos of astrophysical origin. Halzen first proposed the detector in 1988.","IceCube uses about a cubic kilometre of ice at the South Pole fitted with light sensors. It records faint flashes made when neutrinos strike atomic nuclei in the ice.","The prize is worth 12 million Swedish kronor. Halzen, 82, said the award came as a great surprise. The prizes are presented on 10 December."],

{id:"sci-phoenix-planet",

 head:"Astronomers report a planet formed from a dying star's debris",
 stand:"A Warwick-led team says a gas giant orbiting a white dwarf appears to have formed after its star died, a first observational case.",
 body:["Astronomers led by the University of Warwick report what they describe as the first evidence of a second-generation planet. Their study appeared in Nature Astronomy on 5 October.","The planet is a Jupiter-sized gas giant orbiting the white dwarf HS 0209+0832 about every 4.4 days. It was spotted using NASA's TESS satellite.","The white dwarf's atmosphere holds unusually high levels of zinc, copper and niobium. The team says this pattern points to elements made as the star died, from which the planet then formed.","The idea of such planets was proposed more than 15 years ago. The researchers told Science News that further study is needed to confirm the object's nature."],

{id:"sci-animal-origins-earlier",

 head:"Study suggests animals arose up to 200 million years before fossils show",
 stand:"A molecular clock analysis in Science Advances puts the origin of animals at 800 to 700 million years ago.",
 body:["Researchers from the University of Oxford and Virginia Tech used a molecular clock to estimate when animals first appeared. The study was published in Science Advances on 2 October.","The method compares genetic differences among living organisms with estimated rates of change. It places the origin of animals between 800 and 700 million years ago.","The oldest accepted animal fossils date to about 574 million years ago. That would leave a gap of roughly 200 million years.","The authors say the analysis does not prove animals existed 800 million years ago. Body fossils from before the Ediacaran period have not been found."],

{id:"cl-australia-coal-ruling",

 sub:"Policy",
 head:"Australia's High Court blocks Hunter Valley coal mine expansion over climate harm",
 stand:"The court found planning authorities failed to properly weigh climate impacts when approving the Mount Pleasant mine extension in New South Wales.",
 body:["Australia's High Court ruled on Wednesday against the expansion of the Mount Pleasant open-cut coal mine in the Hunter Valley, New South Wales. The decision upholds an earlier ruling by the state's Court of Appeal that halted the project.","The court found the approval process had not properly considered climate impacts. Reports say planning authorities did not ensure emissions would be minimised as far as practicable, or weigh regional effects such as bushfires, drought and floods.","The extension, sought by MACH Energy, would have run the mine until 2048 and roughly doubled its annual output. RenewEconomy reports the project would have produced about 876 million tonnes of greenhouse gas emissions, mostly from burning exported coal.","The case was brought by a local residents' group. MACH Energy said it was disappointed and would pursue all available options. RenewEconomy reports 17 coal proposals in the state's planning pipeline could be affected."],

 body:["The COP31 climate summit opens on 9 November in Antalya, Türkiye. Türkiye is hosting while Australia leads the negotiations, an arrangement agreed after both countries bid for the event.","The hosts' main proposal asks countries to voluntarily raise electricity's share of final energy demand from about 20% today to 35% by 2035. Critics note that around a third of global electricity still comes from coal.","A phase-out of fossil fuels is not part of the formal negotiations. Brazil is expected to publish a voluntary roadmap for moving away from coal, oil and gas.","Climate finance for poorer countries is also expected to feature. Türkiye's environment minister and COP31 president-designate, Murat Kurum, has named closing the finance gap as a priority."],

 body:["A study in Nature Ecology & Evolution, published on 6 October, combined 423 earlier studies with 222,829 data points. It covered land, freshwater, marine and estuarine ecosystems.","The researchers, led by King's College London, found most of 23 ecosystem services rose steadily as species diversity increased. They did not level off once a few species were present.","The authors say this means the ability of other species to replace lost ones has been overestimated. Ocean carbon storage showed the strongest link to biodiversity, though based on limited data.","Coastal protection was an exception. It depended mainly on one or two key species rather than overall diversity."],

/* ---------- helpers ---------- */
const SEC = id => SECTIONS.find(s=>s.id===id);
const esc = t => String(t).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const passes = s => ORDER.indexOf(s.grade) <= ORDER.indexOf(prefs.min);
const affSec = sec => prefs.taste.sec[sec]||0;
const affinity = s => affSec(s.sec) + 0.5*(prefs.taste.sub[s.sec+"/"+s.sub]||0);
const importance = s => s.sources*10 + s.score/10;
const rankOf = sec => { const i = prefs.order.indexOf(sec); return i<0 ? 10 : i; };
const forYou = s => importance(s) + affinity(s)*6 + (10-rankOf(s.sec))*0.8;
const visible = () => STORIES.filter(s=>prefs.order.includes(s.sec) && passes(s));
const mins = n => Math.max(1, Math.round(n*SECS_PER_STORY/60));
const reduced = () => matchMedia("(prefers-reduced-motion: reduce)").matches;

const I = {
  tick:'<svg viewBox="0 0 24 24" width="13" height="13" aria-hidden="true"><path d="M5 12.5l4.2 4.2L19 7" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  heart:'<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M12 20.3s-7.4-4.6-9.5-9C1 8.2 2.9 4.6 6.6 4.6c2 0 3.6 1.1 5.4 3.2 1.8-2.1 3.4-3.2 5.4-3.2 3.7 0 5.6 3.6 4.1 6.7-2.1 4.4-9.5 9-9.5 9z" fill="currentColor"/></svg>',
  cross:'<svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M6.5 6.5l11 11M17.5 6.5l-11 11" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></svg>',
  undo:'<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 14L4 9l5-5M4 9h10.5a5.5 5.5 0 010 11H11" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  keep:'<svg viewBox="0 0 24 24" width="19" height="19" aria-hidden="true"><path d="M6.5 3.5h11a1 1 0 0 1 1 1v16l-6.5-4.6-6.5 4.6v-16a1 1 0 0 1 1-1z" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg>',
  mic:'<svg viewBox="0 0 24 24" width="12" height="12" aria-hidden="true"><rect x="8.5" y="3" width="7" height="11" rx="3.5" fill="currentColor"/><path d="M5.5 11a6.5 6.5 0 0013 0M12 17.5V21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"/></svg>',
  close:'<svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg>'
};
const grade = s => `<span class="grade g${s.grade}" title="Grade ${s.grade}: ${GRADES[s.grade].label}">${s.grade}</span>`;
const factsList = (s,n=3) => `<ul class="facts">${s.kept.slice(0,n).map(([f,c])=>`<li><span class="tick">${I.tick}</span><span>${esc(f)}<small>${esc(c)}</small></span></li>`).join("")}</ul>`;
/* marks the stories recorded in the presenter's AI voice today */
const vBadge = s => (typeof clipFor==="function" && clipFor(s.id)) ? `<span class="vbadge" title="Read in ${esc(VOICE.name||"our presenter")}'s AI voice in your roundup">${I.mic}${esc(VOICE.name ? VOICE.name+"'s voice" : "Voiced")}</span>` : "";
const cutLabel = s => s.cut.length ? `${s.cut.length} ${s.cut.length===1?"claim":"claims"} cut` : "Nothing cut";

let view = {more:{}, overlay:null, story:null};

/* ---------- reactions (teach the feed) ---------- */
function react(id, v, opts={}){
  const s = STORIES.find(x=>x.id===id); if(!s) return;
  const prev = prefs.react.map[id]||0;
  let next = (opts.toggle && prev===v) ? 0 : v;
  const d = next - prev; if(!d) return;
  const k = s.sec+"/"+s.sub, clamp = x => Math.max(-10, Math.min(10, x));
  prefs.taste.sec[s.sec] = clamp((prefs.taste.sec[s.sec]||0) + d);
  prefs.taste.sub[k] = clamp((prefs.taste.sub[k]||0) + d);
  if(next) prefs.react.map[id] = next; else delete prefs.react.map[id];
  if(next) unsave(id);
  save(); syncTaste();
  if(next===1) toast("Added to your roundup");
  else if(next===-1) toast(`Less ${SEC(s.sec).name} from now on`);
}

/* ---------- saved for later: a neutral swipe up, no effect on your feed ---------- */
/* Saved stories are archived with a full copy of the report, so they stay readable after the edition changes. Kept in this browser until removed. */
function archiveEntry(s){
  const snap = {id:s.id, sec:s.sec, sub:s.sub, head:s.head, stand:s.stand, body:s.body, kept:s.kept, cut:s.cut, open:s.open, primary:s.primary, m:s.m,
    secName:(SECTIONS.find(x=>x.id===s.sec)||{}).name||s.sec, src:s.src.map(([k,u,n])=>[k,u,n||"",OUTLETS[k]?.name||k,OUTLETS[k]?.country||""])};
  return {id:s.id, issue:EDITION.issue, date:EDITION.date, at:Date.now(), s:snap};
}
const isToday = e => e.issue===EDITION.issue && STORIES.some(x=>x.id===e.id);
const isSaved = id => prefs.archive.some(e=>e.id===id);
function addSave(id){ const s = STORIES.find(x=>x.id===id); if(s && !isSaved(id)) prefs.archive.push(archiveEntry(s)); }
function unsave(id){ prefs.archive = prefs.archive.filter(e=>e.id!==id); }
const todaySaved = () => prefs.archive.filter(isToday);
function getStory(id){
  const live = STORIES.find(x=>x.id===id); if(live) return live;
  const e = prefs.archive.find(x=>x.id===id); if(!e) return null;
  return gradeStory(Object.assign({archived:e.date}, JSON.parse(JSON.stringify(e.s))));
}
const secName = s => SEC(s.sec)?.name || s.secName || s.sec;
function toggleSave(id){
  if(isSaved(id)){ unsave(id); save(); toast("Removed from saved for later"); }
  else { addSave(id); save(); toast("Saved for later"); }
}
function savedRows(entries, n0){
  return entries.map((e,i)=>{ const s = getStory(e.id), live = isToday(e);
    return `<li><span class="rn">${n0+i+1}</span>
      <div class="rbody"><button class="hl" data-open="${s.id}">${esc(s.head)}</button><small>${esc(secName(s))} · ${s.kept.length} facts checked · Grade ${s.grade}</small></div>
      ${live?`<button class="rb up" data-react="${s.id}" data-v="1" aria-pressed="false" aria-label="Add to your roundup">${I.heart}</button>`:`<span></span>`}
      <button class="rb" data-unsave="${s.id}" aria-label="Remove from saved for later">${I.close}</button></li>`; }).join("");
}
function savedBody(){
  const all = prefs.archive.slice().sort((a,b)=>b.at-a.at);
  if(!all.length) return `<p class="muted">Nothing saved yet. Swipe a card up, or tap the bookmark, to keep a story here. Saved stories stay until you remove them, even after today's edition is replaced.</p>`;
  const today = all.filter(isToday), older = all.filter(e=>!isToday(e));
  const groups = {}; older.forEach(e=>{ (groups[e.date] = groups[e.date] || []).push(e); });
  let n = 0, html = "";
  if(today.length){ html += `<h3 class="sgroup">Today</h3><ol class="rlist slist">${savedRows(today, n)}</ol>`; n += today.length; }
  Object.entries(groups).forEach(([d, list])=>{ html += `<h3 class="sgroup">${esc(d)}</h3><ol class="rlist slist">${savedRows(list, n)}</ol>`; n += list.length; });
  return html + (today.length && prefs.mode==="swipe" ? `<div class="endbtns"><button class="pill" data-reswipe>Swipe today's saved again</button></div>` : "");
}
function savedSection(){
  if(!prefs.archive.length) return "";
  return `<section class="saved" id="saved"><h2>Saved for later</h2>
    <p class="muted">${prefs.archive.length} ${prefs.archive.length===1?"story":"stories"}, kept until you remove them. Tap one to read it.</p>
    ${savedBody()}</section>`;
}
function savedSheet(){
  return `<h2 class="sh-title">Saved for later</h2>
    <p class="stand">Stories you swiped up on, archived with their full receipts.</p>
    ${savedBody()}
    <p class="muted">Your archive lives in this browser, so it stays on this device.</p>`;

/* ---------- brand bits ---------- */
const SHORT_DATE = EDITION.date.replace(/^(\w{3})\w*,\s*(\d+)\s+(\w{3})\w*.*$/, "$1 $2 $3");
const LOGO = (inv) => `<svg class="drlogo${inv?" inv":""}" viewBox="0 0 96 120" aria-hidden="true"><path class="lg-body" d="M6 10a8 8 0 0 1 8-8h68a8 8 0 0 1 8 8v96l-7 8-7-8-7 8-7-8-7 8-7-8-7 8-7-8-7 8-7-8-7 8-7-8z"/><text class="lg-txt" x="48" y="62" text-anchor="middle">DR</text><path class="lg-dash" d="M22 78h52"/><path class="lg-tick" d="M34 90l8 7 18-16"/></svg>`;
const totalLine = s => `<div class="total"><span>${s.kept.length} facts checked</span><span class="${s.cut.length?"cutn":""}">${cutLabel(s)}</span><span>Grade ${s.grade}</span></div>`;

/* ---------- scroll mode: a stack of receipts ---------- */
function item(s, why){

    <div class="meta"><span>${esc(SEC(s.sec).name)} · ${esc(s.sub)}</span>${why?`<span class="why">${esc(why)}</span>`:""}${vBadge(s)}${grade(s)}</div>

function intro(count, label){
  return `<section class="intro">
    <div class="date">${esc(EDITION.date)} · No. ${EDITION.issue}</div>
    <h1>Today's news, <span>with receipts.</span></h1>
    <p>${label}</p>
    <div class="stats"><span>${count} stories</span><span>${ALL_OUTLETS} outlets checked</span>${prefs.streak.n>1?`<span class="hot">Day ${prefs.streak.n} streak</span>`:""}</div>
    <p class="introbtn"><button class="rpill" data-roundup>Your roundup · ${liked().length}</button> <button class="rpill" data-saved>Saved · ${prefs.archive.length}</button>${anyPuz()?` <button class="rpill" data-puzzles>Puzzles</button>`:""}</p>
  </section>`;
}
function rhead(title, right){ return `<div class="band"><h2>${esc(title)}</h2><span>${right}</span></div>`; }
function renderScroll(){
  const vis = visible();
  const top = vis.slice().sort((a,b)=>forYou(b)-forYou(a)).slice(0, TOP_N);
  const topIds = new Set(top.map(s=>s.id));
  let html = intro(vis.length, `The top ${top.length} in about ${mins(top.length)} minutes. The rest if you fancy it.`);
  if(!vis.length) return html + `<div class="rcpt"><div class="end"><h2>Nothing here yet</h2><p>Add topics or widen the grade filter.</p><button class="pill" data-settings>Your topics</button></div></div>`;
  html += `<div class="rcpt">${rhead("Top stories", `${mins(top.length)} min`)}
    ${top.map(s=>item(s, affSec(s.sec)>=2 ? `Because you like ${SEC(s.sec).name}` : "")).join("")}</div>
    <p class="between">Done with the top? Keep scrolling for more.</p>`;
  prefs.order.forEach((secId, rank)=>{
    const sec = SEC(secId);
    const list = vis.filter(s=>s.sec===secId && !topIds.has(s.id)).sort((a,b)=>forYou(b)-forYou(a));
    if(!list.length) return;
    const lim = view.more[secId] ? Infinity : (rank<3?4:2) + Math.max(0, Math.round(affSec(secId)/2));
    const shown = list.slice(0, lim), extra = list.length - shown.length;
    html += `<section class="rcpt" id="sec-${secId}">${rhead(sec.name, `${list.length} more`)}
      ${shown.map(s=>item(s,"")).join("")}
      ${extra>0?`<button class="secmore" data-more="${secId}">${extra} more in ${esc(sec.name)}</button>`:""}
    </section>`;
  });
  html += `<div class="rcpt last"><div class="end">${LOGO(false)}<h2>You're up to date.</h2><p>That's today's receipts. The next edition drops tomorrow at about 6am.</p>${liked().length?`<div class="endbtns"><button class="pill solid" data-roundup>Listen to your roundup (${liked().length})</button></div>`:""}${anyPuz()?`<div class="endbtns"><button class="pill" data-puzzles>Today's puzzles</button><button class="pill" data-restart>Start over in swipe</button></div>`:""}</div>
    ${savedSection()}${feedbackSection()}</div>`;
  return html;
}

/* ---------- swipe mode: one clean card per story ---------- */
function deckList(){
  const done = new Set(prefs.swiped.ids);
  return visible().filter(s=>!done.has(s.id)).sort((a,b)=>forYou(b)-forYou(a));
}
function card(s, depth){
  return `<article class="card d${depth}" ${depth===0?`id="topcard" tabindex="0" aria-label="${esc(s.head)}. Swipe right for more like this, left for less, up to save for later. Press Enter for the receipts."`:'aria-hidden="true"'} data-id="${s.id}">
    <span class="stamp more">MORE</span><span class="stamp less">LESS</span><span class="stamp save">LATER</span>
    <div class="cin">
      <div class="chead">${LOGO(false)}<span>No. ${EDITION.issue} · ${esc(SHORT_DATE)}</span>${grade(s)}</div>
      <div class="meta"><span>${esc(SEC(s.sec).name)} · ${esc(s.sub)}</span>${vBadge(s)}</div>
      <h3>${esc(s.head)}</h3>
      <p class="cstand">${esc(s.stand)}</p>
      ${factsList(s)}
    </div>
    <div class="cardfoot"><span>${s.kept.length} checked · <span class="${s.cut.length?"cutn":""}">${cutLabel(s)}</span></span><span>Tap for receipts</span></div>
  </article>`;
}
function renderSwipe(){
  const all = visible(), deck = deckList();
  const done = all.length - deck.length;
  if(!deck.length){
    const leans = Object.entries(prefs.taste.sec).filter(([,v])=>v>0).sort((a,b)=>b[1]-a[1]).slice(0,3).map(([k])=>SEC(k)?.name).filter(Boolean);
    return `<div class="deckwrap"><div class="rcpt last"><div class="end">${LOGO(false)}
      <h2>All caught up.</h2>
      <p>${all.length} stories, done. They're all here until tomorrow's edition, so you can start over any time.${leans.length?` We'll lean into ${esc(leans.join(", "))} tomorrow.`:""}</p>
      <div class="endbtns">${liked().length?`<button class="pill solid" data-roundup>Listen to your roundup (${liked().length})</button>`:""}<button class="pill" data-restart>Start over from story 1</button>${anyPuz()?`<button class="pill" data-puzzles>Today's puzzles</button>`:""}<button class="pill" data-mode="scroll">Open the full edition</button></div>
    </div>${savedSection()}${feedbackSection()}</div></div>`;
  }
  const cards = deck.slice(0,3).map((s,i)=>card(s,i)).reverse().join("");
  return `<div class="deckwrap">
    <div class="dtop"><p class="dcount" aria-live="polite">${done+1} of ${all.length}<span class="dmin"> · ${mins(deck.length)} min left</span></p><span class="dpills">${anyPuz()?`<button class="rpill" data-puzzles>Puzzles</button>`:""}<button class="rpill" data-roundup>Roundup · ${liked().length}</button></span></div>
    <div class="deck" id="deck">${cards}</div>
    <div class="dbtns">
      <button class="dbtn" data-swipe="-1" aria-label="Less like this">${I.cross}</button>
      <button class="dbtn small" data-undo ${prefs.swiped.ids.length?"":"disabled"} aria-label="Undo last swipe">${I.undo}</button>
      <button class="dbtn keep" data-swipe="up" aria-label="Save for later">${I.keep}</button>
      <button class="dbtn love" data-swipe="1" aria-label="More like this">${I.heart}</button>
    </div>
    <p class="hint">Right for more, left for less, up to save for later.</p>
    <div class="dlinks"><button class="dlink" data-restart ${done?"":"disabled"}>Start over</button><button class="dlink" data-saved>Saved for later · ${prefs.archive.length}</button></div>
  </div>`;
}

function commit(dir){
  const el = document.getElementById("topcard"); if(!el) return;
  const id = el.dataset.id;
  react(id, dir);
  prefs.swiped.ids.push(id); save();
  if(reduced()){ render(); return; }
  el.style.transition = "transform .28s ease-in, opacity .28s";
  el.style.transform = `translateX(${dir*130}%) rotate(${dir*18}deg)`; el.style.opacity = "0";
  setTimeout(()=>{ render(); document.getElementById("topcard")?.focus({preventScroll:true}); }, 230);
}
function commitUp(){
  const el = document.getElementById("topcard"); if(!el) return;
  const id = el.dataset.id;
  addSave(id);
  prefs.swiped.ids.push(id); save();
  toast(`Saved for later · ${prefs.archive.length} in your list`);
  if(reduced()){ render(); return; }
  el.style.transition = "transform .28s ease-in, opacity .28s";
  el.style.transform = "translateY(-120%) scale(.9)"; el.style.opacity = "0";
  setTimeout(()=>{ render(); document.getElementById("topcard")?.focus({preventScroll:true}); }, 230);
}
function undo(){
  const id = prefs.swiped.ids.pop(); if(!id) return;
  const v = prefs.react.map[id]||0; if(v) react(id, v, {toggle:true});
  unsave(id);
  save(); render(); toast("Brought it back");
}
/* make sure every headline shows in full: shrink the headline, then drop the summary, then trim facts */
function fitCards(){
  document.querySelectorAll(".card").forEach(c=>{
    const cin = c.querySelector(".cin"), h = c.querySelector("h3");
    if(!cin || !h) return;
    const over = () => cin.scrollHeight > cin.clientHeight + 1;
    let size = parseFloat(getComputedStyle(h).fontSize);
    while(over() && size > 18){ size -= 1; h.style.fontSize = size + "px"; }
    if(over()) c.classList.add("tight");
    const items = [...c.querySelectorAll(".facts li")];
    while(over() && items.length > 1){ items.pop().remove(); }
  });
}
let fitT; addEventListener("resize", ()=>{ clearTimeout(fitT); fitT=setTimeout(()=>{ if(prefs.mode==="swipe" && !view.overlay) render(); }, 250); });
function wireDeck(){
  const el = document.getElementById("topcard"); if(!el) return;
  let x0=0, y0=0, dx=0, dy=0, down=false, t0=0;
  const more = el.querySelector(".stamp.more"), less = el.querySelector(".stamp.less"), keep = el.querySelector(".stamp.save");
  const clamp01 = v => Math.max(0, Math.min(1, v));
  el.addEventListener("pointerdown", e=>{ down=true; x0=e.clientX; y0=e.clientY; dx=dy=0; t0=Date.now(); el.setPointerCapture(e.pointerId); el.style.transition="none"; });
  el.addEventListener("pointermove", e=>{
    if(!down) return; dx = e.clientX - x0; dy = e.clientY - y0;
    const up = dy < 0 && -dy > Math.abs(dx);
    const ty = up ? dy : Math.max(-20, Math.min(20, dy*.25));
    el.style.transform = `translate(${dx}px, ${ty}px) rotate(${up?0:dx/22}deg)`;
    more.style.opacity = up?0:clamp01(dx/100); less.style.opacity = up?0:clamp01(-dx/100); keep.style.opacity = up?clamp01(-dy/90):0;
  });
  const end = e=>{
    if(!down) return; down=false;
    const ax = Math.abs(dx), ay = Math.abs(dy);
    if(dy < -90 && ay > ax) return commitUp();
    if(ax > 100 && ax > ay) return commit(dx>0?1:-1);
    el.style.transition = "transform .2s ease"; el.style.transform = ""; more.style.opacity = less.style.opacity = keep.style.opacity = 0;
    if(ax < 6 && ay < 6 && Date.now()-t0 < 600) openStory(el.dataset.id);
  };
  el.addEventListener("pointerup", end); el.addEventListener("pointercancel", end);
}

  return `<div class="meta">${grade(s)}<span>${esc(SEC(s.sec).name)} · ${esc(s.sub)}</span>${vBadge(s)}</div>

function renderOverlay(){

  if(view.overlay==="story" && !s){ view.overlay=null; renderOverlay(); return; }
  const isR = view.overlay==="roundup", isS = view.overlay==="saved";
  const ovKey = view.overlay+"|"+(view.story||""), same = o.dataset.ov===ovKey, prevTop = same ? (o.querySelector(".sheet")?.scrollTop||0) : 0;

/* ---------- your roundup: liked stories, read as an audio bulletin ---------- */
const liked = () => STORIES.filter(s=>prefs.react.map[s.id]===1);
const canSpeak = typeof window!=="undefined" && "speechSynthesis" in window && typeof SpeechSynthesisUtterance!=="undefined";
let bul = {playing:false, paused:false, segs:[], i:0, story:-1, n:0};
function pickVoice(){
  if(!canSpeak) return null;
  const vs = speechSynthesis.getVoices();
  return vs.find(v=>/en-GB/i.test(v.lang) && /natural|neural|premium|enhanced|siri/i.test(v.name))
      || vs.find(v=>/en-GB/i.test(v.lang)) || vs.find(v=>/^en/i.test(v.lang)) || null;
}
if(canSpeak){ try{ speechSynthesis.getVoices(); speechSynthesis.addEventListener?.("voiceschanged", ()=>{}); }catch(e){} }
const spoken = t => String(t).replace(/\s*\([^)]*\)/g,"").replace(/–/g," to ").replace(/\s+/g," ").trim();

/* Recorded voice: each morning a clip per story is made in the presenter's cloned voice and listed in audio/manifest.json.
   Anything without a clip is read by the device voice instead, so the bulletin always plays. */
let VOICE = null;
const bulDay = () => EDITION.date.replace(/,?\s*\d{4}$/,"");
/* what gets read for each story: the presenter-style `say` line when the edition has one, else its two key facts (never the headline). No grades or source counts. */
const storyScript = s => s.say ? spoken(s.say) : s.kept.slice(0,2).map(([f])=>spoken(f)+".").join(" ");
const VOICE_FIXED = {intro:"Hello, and welcome to your Daily Receipts roundup. Here are the stories you picked.", first:"First.", next:"Next.", finally:"Finally.", outro:"And that's the news, with the receipts. Thanks for listening, and see you tomorrow."};
/* the exact words to record today; used by the morning job so the script and the app never drift apart */
function voiceScript(){
  return {issue:EDITION.issue, date:EDITION.date, fixed:VOICE_FIXED,
    stories:STORIES.slice().sort((a,b)=>importance(b)-importance(a)).map(s=>({id:s.id, text:storyScript(s)}))};
}
fetch("audio/manifest.json", {cache:"no-store"}).then(r=>r.ok ? r.json() : null).then(m=>{
  if(m && m.issue===EDITION.issue && m.clips){ VOICE = m; updatePlayer(); render(); if(view.overlay==="roundup" || view.overlay==="story") renderOverlay(); }
}).catch(()=>{});
const clipFor = id => VOICE && VOICE.clips[id];
const voiced = list => !!VOICE && list.every(s=>clipFor(s.id));
function bulletinSegments(list){
  const segs = [];
  const intro = VOICE && (VOICE.parts?.intro || VOICE.intro);
  if(intro) segs.push({src:intro, t:VOICE_FIXED.intro, k:-1});
  else segs.push({t:`Here's your Daily Receipts roundup for ${bulDay()}. ${list.length} ${list.length===1?"story":"stories"}.`, k:-1});
  list.forEach((s,i)=>{
    const key = list.length===1 ? "" : i===0 ? "first" : i===list.length-1 ? "finally" : "next";
    const clip = clipFor(s.id);
    if(clip){
      if(key) segs.push({src:VOICE.parts?.[key], t:VOICE_FIXED[key], k:i});
      segs.push({src:clip, t:storyScript(s), k:i});
    } else {
      if(key) segs.push({t:VOICE_FIXED[key], k:i});
      segs.push({t:storyScript(s), k:i});
    }
  });
  segs.push({src:VOICE?.parts?.outro, t:VOICE_FIXED.outro, k:-1});
  return segs;
}
const bulletinMins = list => Math.max(1, Math.round(bulletinSegments(list).map(x=>x.t).join(" ").split(/\s+/).length / 150));
const bulAudio = typeof Audio!=="undefined" ? new Audio() : null;
if(bulAudio) bulAudio.preload = "auto";
let preAudio = null;
function speakFrom(i){
  bul.i = i;
  if(canSpeak) speechSynthesis.cancel();
  if(bulAudio){ bulAudio.onended = bulAudio.onerror = null; bulAudio.pause(); }
  if(i >= bul.segs.length){ bulStop(true); return; }
  const seg = bul.segs[i], next = ()=>{ if(bul.playing && !bul.paused && bul.i===i) speakFrom(i+1); };
  markStory(seg.k);
  if(seg.src && bulAudio){
    bulAudio.onended = next;
    const fallback = ()=>{ if(bul.i!==i || !seg.src || bul.paused) return; seg.src = null; speakFrom(i); };
    bulAudio.onerror = fallback;   /* clip failed: read it with the device voice */
    bulAudio.src = seg.src;
    const pr = bulAudio.play(); if(pr && pr.catch) pr.catch(fallback);
    const nx = bul.segs.slice(i+1).find(x=>x.src); if(nx){ preAudio = new Audio(); preAudio.preload = "auto"; preAudio.src = nx.src; }
    return;
  }
  if(!canSpeak){ next(); return; }
  const u = new SpeechSynthesisUtterance(seg.t), v = pickVoice();
  if(v){ u.voice = v; u.lang = v.lang; } else u.lang = "en-GB";
  u.rate = 1.03;
  u.onstart = ()=>markStory(seg.k);
  u.onend = next;
  u.onerror = e=>{ if(e.error!=="interrupted" && e.error!=="canceled" && bul.i===i){ bulStop(); toast("Audio stopped. Tap play to try again"); } };
  speechSynthesis.speak(u);
}
function bulPlay(){
  const seg = bul.segs[bul.i];
  if(bul.playing && !bul.paused){ bul.paused = true; if(seg && seg.src && bulAudio) bulAudio.pause(); else if(canSpeak) speechSynthesis.cancel(); updatePlayer(); return; }
  if(bul.playing && bul.paused){ bul.paused = false; updatePlayer();
    if(seg && seg.src && bulAudio && bulAudio.src && !bulAudio.ended){ const pr = bulAudio.play(); if(pr && pr.catch) pr.catch(()=>speakFrom(bul.i)); } else speakFrom(bul.i); return; }
  const list = liked(); if(!list.length) return;
  bul = {playing:true, paused:false, segs:bulletinSegments(list), i:0, story:-1, n:list.length};
  updatePlayer(); speakFrom(0);
}
function bulNext(){
  if(!bul.playing) return;
  const j = bul.segs.findIndex((x,idx)=> idx > bul.i && x.k > bul.story);
  bul.paused = false; updatePlayer(); speakFrom(j<0 ? bul.segs.length-1 : j);
}
function bulStop(done){
  if(canSpeak) speechSynthesis.cancel();
  if(bulAudio){ bulAudio.onended = bulAudio.onerror = null; bulAudio.pause(); }
  const was = bul.playing;
  bul = {playing:false, paused:false, segs:[], i:0, story:-1, n:0};
  markStory(-1); updatePlayer();
  if(done && was) toast("That's your roundup");
}
function markStory(k){
  bul.story = k;
  document.querySelectorAll(".rlist li").forEach((li,idx)=>li.classList.toggle("now", bul.playing && idx===k));
  updatePlayer();
}
const voiceLabel = () => VOICE ? `read by an AI version of ${VOICE.name ? VOICE.name+"'s" : "our presenter's"} voice` : "read aloud by your device";
function updatePlayer(){
  const b = document.getElementById("bul-play"), st = document.getElementById("bul-stat");
  if(b) b.textContent = !bul.playing ? "Play bulletin" : bul.paused ? "Resume" : "Pause";
  if(st) st.textContent = !bul.playing ? `About ${bulletinMins(liked())} min · ${voiceLabel()}`
    : bul.paused ? "Paused" : bul.story<0 ? "Playing" : `Story ${bul.story+1} of ${bul.n}`;
  document.querySelectorAll("[data-bul='next'],[data-bul='stop']").forEach(x=>x.disabled = !bul.playing);
}
function roundupSheet(){
  const list = liked();
  if(!list.length) return `<h2 class="sh-title">Your roundup</h2>
    <p class="stand">Your own daily bulletin, built from the stories you like.</p>
    <p class="muted">Tap the heart or swipe right on any story to add it here. Then come back and press play to hear them read out as a short news bulletin.</p>
    <p><button class="pill solid" data-close>Find stories</button></p>`;
  const can = canSpeak || voiced(list);
  return `<h2 class="sh-title">Your roundup</h2>
    <p class="stand">The ${list.length} ${list.length===1?"story":"stories"} you liked today, as a quick bulletin.</p>
    ${can ? `<div class="player">
        <button class="pill solid" id="bul-play" data-bul="play">Play bulletin</button>
        <button class="pill" data-bul="next" disabled>Next story</button>
        <button class="pill" data-bul="stop" disabled>Stop</button>
        <span class="bstat" id="bul-stat" aria-live="polite"></span>
      </div>` : `<p class="muted">Audio isn't available in this browser. Try opening the link in Safari or Chrome.</p>`}
    <h4>In your roundup</h4>
    <ol class="rlist">${list.map((s,i)=>`<li><span class="rn">${i+1}</span>
      <div class="rbody"><button class="hl" data-open="${s.id}">${esc(s.head)}</button><small>${esc(SEC(s.sec).name)} · ${s.kept.length} facts checked · Grade ${s.grade}</small>${vBadge(s)}</div>
      <button class="rb up" data-react="${s.id}" data-v="1" aria-pressed="true" aria-label="Remove from your roundup">${I.heart}</button></li>`).join("")}</ol>
    <p class="muted">The bulletin reads each story and its key facts${VOICE?`. Voice: ${voiceLabel()}`:""}.</p>`;
}

function seedFrom(str){ let h = 2166136261>>>0; for(const ch of String(str)){ h ^= ch.charCodeAt(0); h = Math.imul(h, 16777619)>>>0; } return h; }
function rng(seed){ let a = seed>>>0; return ()=>{ a = (a + 0x6D2B79F5)>>>0; let t = a; t = Math.imul(t ^ t>>>15, t|1); t ^= t + Math.imul(t ^ t>>>7, t|61); return ((t ^ t>>>14)>>>0) / 4294967296; }; }
function shuffled(arr, r){ const a = arr.slice(); for(let i=a.length-1;i>0;i--){ const j = Math.floor(r()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; } return a; }

const CW_LEVELS = {
  1:{n:6,  tiers:[1],         max:6,  size:9},
  2:{n:7,  tiers:[1,1,1,2],   max:7,  size:9},
  3:{n:9,  tiers:[1,2,2],     max:8,  size:11},
  4:{n:10, tiers:[2,2,3],     max:9,  size:11},
  5:{n:12, tiers:[2,3,3,3],   max:10, size:11}
};
function cwLayout(cands, cfg, r){
  const cells = new Map(), K = (a,b)=>a+","+b, words = [];
  let minR=0, maxR=0, minC=0, maxC=0, inters=0;
  const fits = (w, sr, sc, dir)=>{
    const dr = dir==="d"?1:0, dc = dir==="a"?1:0, L = w.length;
    if(cells.has(K(sr-dr, sc-dc)) || cells.has(K(sr+dr*L, sc+dc*L))) return -1;
    let hit = 0;
    for(let i=0;i<L;i++){
      const rr = sr+dr*i, cc = sc+dc*i, cell = cells.get(K(rr,cc));
      if(cell){ if(cell.ch!==w[i] || cell[dir]) return -1; hit++; }
      else if(dir==="a" ? (cells.has(K(rr-1,cc))||cells.has(K(rr+1,cc))) : (cells.has(K(rr,cc-1))||cells.has(K(rr,cc+1)))) return -1;
    }
    const a0 = Math.min(minR,sr), a1 = Math.max(maxR, sr+dr*(L-1)), b0 = Math.min(minC,sc), b1 = Math.max(maxC, sc+dc*(L-1));
    if(a1-a0+1 > cfg.size || b1-b0+1 > cfg.size) return -1;
    if(!hit || hit===L) return -1;
    return hit*10 - ((a1-a0+1)*(b1-b0+1) - (maxR-minR+1)*(maxC-minC+1))*0.3 + r()*3;
  };
  const put = (e, sr, sc, dir)=>{
    const dr = dir==="d"?1:0, dc = dir==="a"?1:0;
    for(let i=0;i<e.w.length;i++){
      const k = K(sr+dr*i, sc+dc*i), cell = cells.get(k) || {ch:e.w[i]};
      if(cell.a||cell.d) inters++;
      cell[dir] = true; cells.set(k, cell);
    }
    minR = Math.min(minR,sr); maxR = Math.max(maxR, sr+dr*(e.w.length-1)); minC = Math.min(minC,sc); maxC = Math.max(maxC, sc+dc*(e.w.length-1));
    words.push({w:e.w, c:e.c, r:sr, col:sc, dir});
  };
  put(cands[0], 0, 0, r()<.5?"a":"d");
  for(const e of cands.slice(1)){
    if(words.length >= cfg.n) break;
    if(words.some(x=>x.w===e.w)) continue;
    let best = null;
    for(const pw of words){
      const nd = pw.dir==="a"?"d":"a";
      for(let i=0;i<pw.w.length;i++) for(let j=0;j<e.w.length;j++){
        if(pw.w[i]!==e.w[j]) continue;
        const cr = pw.r + (pw.dir==="d"?i:0), cc = pw.col + (pw.dir==="a"?i:0);
        const sr = cr - (nd==="d"?j:0), sc = cc - (nd==="a"?j:0);
        const sc0 = fits(e.w, sr, sc, nd);
        if(sc0>=0 && (!best || sc0>best.s)) best = {s:sc0, sr, sc, nd};
      }
    }
    if(best) put(e, best.sr, best.sc, best.nd);
  }
  return {words, inters, minR, minC, rows:maxR-minR+1, cols:maxC-minC+1, score: words.length*100 + inters*12 - (maxR-minR+1)*(maxC-minC+1)*0.5};
}
function makeCrossword(level, seedStr){
  const cfg = CW_LEVELS[level] || CW_LEVELS[1], r = rng(seedFrom(seedStr));
  const byTier = {}; [1,2,3].forEach(t=>byTier[t] = shuffled(CW_BANK.filter(e=>e.t===t && e.w.length>=3 && e.w.length<=cfg.max), r));
  let best = null;
  for(let attempt=0; attempt<36; attempt++){
    const used = new Set(), cands = [];
    while(cands.length < cfg.n*5){
      const t = cfg.tiers[Math.floor(r()*cfg.tiers.length)], list = byTier[t];
      const e = list[Math.floor(r()*list.length)];
      if(!used.has(e.w)){ used.add(e.w); cands.push(e); }
    }
    const longFirst = cands.slice().sort((a,b)=>b.w.length-a.w.length);
    const start = longFirst.splice(Math.floor(r()*3),1)[0];
    const res = cwLayout([start, ...shuffled(longFirst, r)], cfg, r);
    if(!best || res.score > best.score) best = res;
    if(best.words.length >= cfg.n && attempt >= 12) break;
  }
  const words = best.words.map(x=>({w:x.w, c:x.c, r:x.r-best.minR, col:x.col-best.minC, dir:x.dir}));
  const starts = [...new Set(words.map(x=>x.r*100+x.col))].sort((a,b)=>a-b);
  words.forEach(x=>x.num = starts.indexOf(x.r*100+x.col)+1);
  words.sort((a,b)=> (a.dir===b.dir ? a.num-b.num : a.dir==="a"?-1:1));
  const sol = {}, at = {};
  words.forEach((x,wi)=>{ for(let i=0;i<x.w.length;i++){ const k = (x.r+(x.dir==="d"?i:0))+","+(x.col+(x.dir==="a"?i:0)); sol[k] = x.w[i]; (at[k] = at[k]||{})[x.dir] = wi; } });
  const nums = {}; words.forEach(x=>nums[x.r+","+x.col] = x.num);
  return {level, rows:best.rows, cols:best.cols, words, sol, at, nums};
}

/* sudoku: seeded full grid, then remove clues while the answer stays unique */
function suSolve(g, limit, r){
  const rows = new Array(9).fill(0), cols = new Array(9).fill(0), boxes = new Array(9).fill(0);
  const bx = i => ((i/27)|0)*3 + (((i%9)/3)|0);
  for(let i=0;i<81;i++) if(g[i]){ const b = 1<<g[i]; rows[(i/9)|0] |= b; cols[i%9] |= b; boxes[bx(i)] |= b; }
  let count = 0;
  const rec = ()=>{
    let best = -1, bm = 0, bn = 10;
    for(let i=0;i<81;i++) if(!g[i]){
      const m = ~(rows[(i/9)|0] | cols[i%9] | boxes[bx(i)]) & 0x3FE;
      let n = 0; for(let x=m; x; x &= x-1) n++;
      if(n < bn){ bn = n; best = i; bm = m; if(!n) return false; }
    }
    if(best < 0){ count++; return count >= limit; }
    let ds = []; for(let d=1; d<=9; d++) if(bm & (1<<d)) ds.push(d);
    if(r) ds = shuffled(ds, r);
    const ri = (best/9)|0, ci = best%9, bi = bx(best);
    for(const d of ds){
      const b = 1<<d; g[best] = d; rows[ri] |= b; cols[ci] |= b; boxes[bi] |= b;
      if(rec()) return true;
      g[best] = 0; rows[ri] &= ~b; cols[ci] &= ~b; boxes[bi] &= ~b;
    }
    return false;
  };
  rec();
  return count;
}
const SU_CLUES = {1:44, 2:37, 3:32, 4:28, 5:25};
function makeSudoku(level, seedStr){
  const r = rng(seedFrom(seedStr)), g = new Array(81).fill(0);
  suSolve(g, 1, r);
  const sol = g.slice(), target = SU_CLUES[level] || 44;
  let clues = 81;
  for(const i of shuffled([...Array(81).keys()], r)){
    if(clues <= target) break;
    const v = g[i]; g[i] = 0;
    if(suSolve(g.slice(), 2) !== 1) g[i] = v; else clues--;
  }
  return {level, puzzle:g.join(""), solution:sol.join(""), clues};
}

  box.innerHTML = `${day.done ? resultPanel("cw") : `<div class="cwbar"><button data-cwnav="-1" aria-label="Previous clue">‹</button><p><b>${w.num} ${w.dir==="a"?"Across":"Down"}</b>${esc(w.c)} (${w.w.length})</p><button data-cwnav="1" aria-label="Next clue">›</button></div>`}
    <div class="cwgrid" style="--n:${p.cols}">${grid}</div>
    ${day.done ? "" : `<div class="pzbtns"><button class="pill" data-cwact="check">Check</button><button class="pill" data-cwact="letter">Reveal letter</button><button class="pill" data-cwact="reveal">${Date.now()-CW.confirm<4000?"Sure? Tap again":"Reveal all"}</button></div>`}
    <div class="cwclues"><div><h4>Across</h4><ol>${list("a")}</ol></div><div><h4>Down</h4><ol>${list("d")}</ol></div></div>`;
}
function cwFocus(){ const i = document.getElementById("cw-in"); if(i){ i.focus({preventScroll:true}); try{ i.setSelectionRange(1,1); }catch(e){} } }
function cwMove(step){
  const w = CW.p.words[cwWord()], cells = cwCells(w), i = cells.indexOf(CW.sel.r+","+CW.sel.c), j = i+step;
  if(j>=0 && j<cells.length){ const [r,c] = cells[j].split(",").map(Number); CW.sel.r = r; CW.sel.c = c; return true; }
  return false;
}
function cwSelectWord(i){ const w = CW.p.words[(i+CW.p.words.length)%CW.p.words.length]; const day = prefs.puz.cw.day;
  const empty = cwCells(w).find(k=>!day.entries[k]) || cwCells(w)[0]; const [r,c] = empty.split(",").map(Number); CW.sel = {r, c, dir:w.dir}; }
function cwCheckDone(){ const p = CW.p, day = prefs.puz.cw.day; if(Object.keys(p.sol).every(k=>day.entries[k]===p.sol[k])) finishPuzzle("cw","solved"); }
function cwType(ch){
  const day = prefs.puz.cw.day; if(day.done) return;
  const k = CW.sel.r+","+CW.sel.c;
  day.entries[k] = ch; day.wrong = day.wrong.filter(x=>x!==k);
  cwMove(1); save(); cwCheckDone(); cwDraw();
}
function cwBack(){
  const day = prefs.puz.cw.day; if(day.done) return;
  const k = CW.sel.r+","+CW.sel.c;
  if(day.entries[k]) delete day.entries[k];
  else if(cwMove(-1)) delete day.entries[CW.sel.r+","+CW.sel.c];
  save(); cwDraw();
}
function cwCell(k){
  const [r,c] = k.split(",").map(Number), a = CW.p.at[k];
  if(CW.sel.r===r && CW.sel.c===c){ const other = CW.sel.dir==="a"?"d":"a"; if(a[other]!==undefined) CW.sel.dir = other; }
  else { CW.sel.r = r; CW.sel.c = c; if(a[CW.sel.dir]===undefined) CW.sel.dir = CW.sel.dir==="a"?"d":"a"; }
  cwDraw(); cwFocus();
}
function cwAct(a){
  const p = CW.p, day = prefs.puz.cw.day; if(day.done) return;
  if(a==="check"){ day.checks++; day.wrong = Object.keys(day.entries).filter(k=>day.entries[k] && day.entries[k]!==p.sol[k]); toast(day.wrong.length ? `${day.wrong.length} ${day.wrong.length===1?"letter needs":"letters need"} another look` : "All good so far"); }
  else if(a==="letter"){
    let k = CW.sel.r+","+CW.sel.c;
    if(day.entries[k]===p.sol[k]){ const w = p.words[cwWord()]; k = cwCells(w).find(x=>day.entries[x]!==p.sol[x]) || Object.keys(p.sol).find(x=>day.entries[x]!==p.sol[x]); }
    if(k){ day.entries[k] = p.sol[k]; day.rev[k] = 1; day.hints++; day.wrong = day.wrong.filter(x=>x!==k); }
    cwCheckDone();
  }
  else if(a==="reveal"){
    if(Date.now()-CW.confirm > 4000){ CW.confirm = Date.now(); cwDraw(); return; }
    Object.keys(p.sol).forEach(k=>{ if(day.entries[k]!==p.sol[k]) day.rev[k] = 1; day.entries[k] = p.sol[k]; });
    day.wrong = []; finishPuzzle("cw","revealed");
  }
  save(); cwDraw();
}
function cwMount(){
  cwDraw();
  const inp = document.getElementById("cw-in"); if(!inp) return;
  inp.addEventListener("input", e=>{
    if(e.inputType==="deleteContentBackward"){ cwBack(); }
    else { const ch = ((e.data || inp.value.slice(1)) || "").toUpperCase().replace(/[^A-Z]/g,"").slice(-1); if(ch) cwType(ch); }
    inp.value = "_"; try{ inp.setSelectionRange(1,1); }catch(err){}
  });
  inp.addEventListener("keydown", e=>{
    const mv = {ArrowRight:[0,1,"a"], ArrowLeft:[0,-1,"a"], ArrowDown:[1,0,"d"], ArrowUp:[-1,0,"d"]}[e.key];
    if(mv){ e.preventDefault();
      if(CW.sel.dir!==mv[2] && CW.p.at[CW.sel.r+","+CW.sel.c][mv[2]]!==undefined){ CW.sel.dir = mv[2]; }
      else { const k = (CW.sel.r+mv[0])+","+(CW.sel.c+mv[1]); if(CW.p.sol[k]){ CW.sel.r += mv[0]; CW.sel.c += mv[1]; if(CW.p.at[k][CW.sel.dir]===undefined) CW.sel.dir = mv[2]; } }
      cwDraw(); return; }
    if(e.key==="Tab" || e.key==="Enter"){ e.preventDefault(); cwSelectWord(cwWord() + (e.shiftKey?-1:1)); cwDraw(); }
  });
}

/* ---------- sudoku ---------- */
const SU = {p:null, key:"", sel:-1, notes:false, confirm:0};
function suPuzzle(){
  const day = puzDay("su"), key = EDITION.date+"|su|"+day.level;
  if(SU.key!==key){ SU.p = makeSudoku(day.level, key); SU.key = key; SU.sel = -1; }
  if(!day.vals){ day.vals = SU.p.puzzle; save(); }
  return SU.p;
}
function suSheet(){
  const day = puzDay("su"); suPuzzle();
  return `<h2 class="sh-title">Daily sudoku</h2>
    <div class="pzmeta">${lvlDots(day.level)}<span>Level ${day.level} of 5</span><span id="pz-time">${fmtT(day.secs)}</span></div>
    <div id="pz"></div>`;
}
const suPeers = (i,j) => ((i/9)|0)===((j/9)|0) || i%9===j%9 || (((i/27)|0)===((j/27)|0) && (((i%9)/3)|0)===(((j%9)/3)|0));
function suDraw(){
  const box = document.getElementById("pz"); if(!box) return;
  const p = suPuzzle(), day = prefs.puz.su.day, v = day.vals, sel = SU.sel, selV = sel>=0 ? v[sel] : "0", wrong = new Set(day.wrong);
  let grid = "";
  for(let i=0;i<81;i++){
    const r = (i/9)|0, c = i%9, given = p.puzzle[i]!=="0", d = v[i];
    let clash = false;
    if(d!=="0") for(let j=0;j<81;j++) if(j!==i && v[j]===d && suPeers(i,j)){ clash = true; break; }
    const cls = ["suc", given?"given":"", c%3===2&&c<8?"br":"", r%3===2&&r<8?"bb":"", sel>=0&&!day.done&&i!==sel&&suPeers(i,sel)?"peer":"", selV!=="0"&&d===selV&&i!==sel?"same":"", i===sel&&!day.done?"sel":"", clash&&!given?"clash":"", wrong.has(i)?"bad":"", day.rev[i]?"rev":""].filter(Boolean).join(" ");
    const notes = day.notes[i];
    grid += `<button class="${cls}" data-su="${i}" aria-label="Row ${r+1} column ${c+1}${d!=="0"?", "+d:", empty"}${given?", given":""}">${d!=="0" ? d : notes ? `<span class="nt">${[1,2,3,4,5,6,7,8,9].map(n=>`<span>${notes.includes(String(n))?n:""}</span>`).join("")}</span>` : ""}</button>`;
  }
  const left = n => 9 - [...v].filter(x=>x===String(n)).length;
  box.innerHTML = `${day.done ? resultPanel("su") : ""}
    <div class="sugrid">${grid}</div>
    ${day.done ? "" : `<div class="supad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-sun="${n}" ${left(n)<=0?"disabled":""} aria-label="${n}">${n}</button>`).join("")}</div>
    <div class="sutools"><button class="pill" data-suact="notes" aria-pressed="${SU.notes}">Notes ${SU.notes?"on":"off"}</button><button class="pill" data-suact="erase">Erase</button><button class="pill" data-suact="check">Check</button><button class="pill" data-suact="hint">Hint</button><button class="pill" data-suact="reveal">${Date.now()-SU.confirm<4000?"Sure? Tap again":"Reveal all"}</button></div>
    <p class="muted sutip">Tap a square, then a number. Notes lets you pencil in options. Clashing numbers turn red.</p>`}`;
}
function suSet(i, d){ const day = prefs.puz.su.day; day.vals = day.vals.slice(0,i) + d + day.vals.slice(i+1); }
function suInput(n){
  const day = prefs.puz.su.day, p = SU.p, i = SU.sel; if(day.done || i<0 || p.puzzle[i]!=="0") return;
  const d = String(n);
  if(SU.notes){ const cur = day.notes[i]||""; day.notes[i] = cur.includes(d) ? cur.replace(d,"") : [...cur+d].sort().join(""); if(!day.notes[i]) delete day.notes[i]; if(day.vals[i]!=="0") suSet(i,"0"); }
  else {
    suSet(i, day.vals[i]===d ? "0" : d); delete day.notes[i];
    if(day.vals[i]===d) for(let j=0;j<81;j++) if(day.notes[j] && suPeers(i,j)){ day.notes[j] = day.notes[j].replace(d,""); if(!day.notes[j]) delete day.notes[j]; }
    day.wrong = day.wrong.filter(x=>x!==i); delete day.rev[i];
    if(day.vals===p.solution) finishPuzzle("su","solved");
  }
  save(); suDraw();
}
function suAct(a){
  const day = prefs.puz.su.day, p = SU.p; if(day.done && a!=="notes") return;
  if(a==="notes"){ SU.notes = !SU.notes; }
  else if(a==="erase"){ const i = SU.sel; if(i>=0 && p.puzzle[i]==="0"){ suSet(i,"0"); delete day.notes[i]; day.wrong = day.wrong.filter(x=>x!==i); } }
  else if(a==="check"){ day.checks++; day.wrong = [...Array(81).keys()].filter(i=>day.vals[i]!=="0" && day.vals[i]!==p.solution[i]); toast(day.wrong.length ? `${day.wrong.length} ${day.wrong.length===1?"square needs":"squares need"} another look` : "All good so far"); }
  else if(a==="hint"){
    let i = SU.sel;
    if(i<0 || day.vals[i]===p.solution[i]) i = [...Array(81).keys()].find(x=>day.vals[x]!==p.solution[x]);
    if(i!==undefined && i>=0){ suSet(i, p.solution[i]); delete day.notes[i]; day.rev[i] = 1; day.hints++; day.wrong = day.wrong.filter(x=>x!==i); SU.sel = i; }
    if(day.vals===p.solution) finishPuzzle("su","solved");
  }
  else if(a==="reveal"){
    if(Date.now()-SU.confirm > 4000){ SU.confirm = Date.now(); suDraw(); return; }
    for(let i=0;i<81;i++) if(day.vals[i]!==p.solution[i]) day.rev[i] = 1;
    day.vals = p.solution; day.notes = {}; day.wrong = []; finishPuzzle("su","revealed");
  }
  save(); suDraw();
}
document.addEventListener("keydown", e=>{
  if(view.overlay!=="su" || e.target.matches("input,textarea")) return;
  if(/^[1-9]$/.test(e.key)){ e.preventDefault(); suInput(+e.key); }
  else if(e.key==="Backspace" || e.key==="Delete" || e.key==="0"){ e.preventDefault(); suAct("erase"); }
  else if(e.key==="n" || e.key==="N"){ suAct("notes"); }
  else { const mv = {ArrowRight:1, ArrowLeft:-1, ArrowDown:9, ArrowUp:-9}[e.key];
    if(mv){ e.preventDefault(); const i = SU.sel<0 ? 0 : SU.sel + mv; if(i>=0 && i<81 && !(Math.abs(mv)===1 && ((i/9)|0)!==((SU.sel/9)|0))){ SU.sel = i; suDraw(); document.querySelector(`[data-su="${i}"]`)?.focus({preventScroll:true}); } } }
});

function tourGo(i){ if(i<0 || i>=TOUR.length || i===tourI) return; tourI = i; drawTour(); }
