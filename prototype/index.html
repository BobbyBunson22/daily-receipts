/* ---------- hold-and-drag to reorder topics ---------- */
function moveTopic(from, to){
  if(from===to || to<0 || to>=prefs.order.length) return;
  const [id] = prefs.order.splice(from,1); prefs.order.splice(to,0,id);
  save(); render(); renderOverlay();
  const el = document.querySelector(`.orow[data-oid="${id}"]`); el?.focus({preventScroll:true});
  toast(`${SEC(id).name} is now number ${to+1}`);
}
function wireOrder(){
  const list = document.getElementById("olist"); if(!list) return;
  const rows = [...list.children];
  rows.forEach((row, idx)=>{
    let timer = null, drag = false, y0 = 0, x0 = 0, target = idx, h = 0, pid = null;
    const cancel = ()=>{ clearTimeout(timer); timer = null; };
    const start = ()=>{
      drag = true; h = row.getBoundingClientRect().height + 6;
      row.classList.add("lifted"); list.classList.add("sorting");
      try{ row.setPointerCapture(pid); }catch(e){}
      try{ navigator.vibrate && navigator.vibrate(12); }catch(e){}
    };
    row.addEventListener("pointerdown", e=>{
      if(e.button>0) return;
      pid = e.pointerId; y0 = e.clientY; x0 = e.clientX; target = idx;
      timer = setTimeout(start, e.pointerType==="mouse" ? 120 : 260);
    });
    row.addEventListener("pointermove", e=>{
      if(!drag){ if(timer && (Math.abs(e.clientY-y0)>8 || Math.abs(e.clientX-x0)>8)) cancel(); return; }
      e.preventDefault();
      const dy = e.clientY - y0;
      row.style.transform = `translateY(${dy}px) scale(1.02)`;
      target = Math.max(0, Math.min(rows.length-1, idx + Math.round(dy / h)));
      rows.forEach((r,j)=>{ if(r===row) return;
        const shift = (idx<target && j>idx && j<=target) ? -h : (idx>target && j<idx && j>=target) ? h : 0;
        r.style.transform = shift ? `translateY(${shift}px)` : ""; });
    });
    const end = ()=>{
      cancel(); if(!drag) return; drag = false;
      row.classList.remove("lifted"); list.classList.remove("sorting");
      rows.forEach(r=>r.style.transform = "");
      if(target!==idx) moveTopic(idx, target);
    };
    row.addEventListener("pointerup", end); row.addEventListener("pointercancel", end);
    row.addEventListener("touchmove", e=>{ if(drag) e.preventDefault(); }, {passive:false});
    row.addEventListener("contextmenu", e=>{ if(drag || timer) e.preventDefault(); });
    row.addEventListener("keydown", e=>{
      if(e.altKey && (e.key==="ArrowUp" || e.key==="ArrowDown")){ e.preventDefault(); moveTopic(idx, idx + (e.key==="ArrowUp"?-1:1)); }
    });
  });
}

/* ---------- toast + progress ---------- */
let toastT;
function toast(msg){ const t=document.getElementById("toast"); t.textContent=msg; t.classList.add("on"); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove("on"),1800); }
function progress(){
  const bar = document.getElementById("prog"); if(!bar) return;
  let p;
  if(prefs.mode==="swipe"){ const all=visible().length; p = all ? (all-deckList().length)/all : 1; }
  else { const max = Math.max(1, document.documentElement.scrollHeight - innerHeight); p = Math.min(1, scrollY/max); }
  bar.style.width = (p*100).toFixed(1)+"%";
}
addEventListener("scroll", ()=>requestAnimationFrame(progress), {passive:true});

/* ---------- render ---------- */
const app = document.getElementById("app");
function render(){
  document.querySelectorAll("[data-mode]").forEach(b=>{ if(b.closest(".modes")) b.setAttribute("aria-pressed", String(b.dataset.mode===prefs.mode)); });
  document.body.dataset.mode = prefs.mode;
  app.innerHTML = `<div class="wrap">${prefs.mode==="swipe" ? renderSwipe() : renderScroll()}</div>`;
  if(prefs.mode==="swipe"){ wireDeck(); fitCards(); }
  requestAnimationFrame(progress);
}

/* ---------- events ---------- */
document.addEventListener("click", e=>{
  const t = e.target.closest("button,[data-open]"); if(!t) return;
  const d = t.dataset;
  if(d.coach){ endCoach(d.coach); return; }
  if(d.tn) return;
  if("tour" in d){ view.overlay=null; view.fromCoach=false; renderOverlay(); showTour(); return; }
  if("puzzles" in d){ stopTimer(); view.backTo=null; view.overlay="puzzles"; renderOverlay(); return; }
  if(d.play){ view.overlay=d.play; renderOverlay(); return; }
  if(d.topic){ const id = d.topic, i = prefs.order.indexOf(id);
    if(i>=0) prefs.order.splice(i,1); else prefs.order.push(id);
    save(); render(); renderOverlay(); document.querySelector(`[data-topic="${id}"]`)?.focus({preventScroll:true});
    toast(i>=0 ? `${SEC(id).name} removed` : `${SEC(id).name} added at number ${prefs.order.length}`); return; }
  if(d.puzon){ prefs.puz.on[d.puzon] = !prefs.puz.on[d.puzon]; save(); render(); renderOverlay(); toast(`${PZ_NAMES[d.puzon]} ${prefs.puz.on[d.puzon]?"on":"off"}`); return; }
  if(d.cell){ cwCell(d.cell); return; }
  if(d.cwclue){ cwSelectWord(+d.cwclue); cwDraw(); cwFocus(); return; }
  if(d.cwnav){ cwSelectWord(cwWord() + (+d.cwnav)); cwDraw(); cwFocus(); return; }
  if(d.cwact){ cwAct(d.cwact); if(d.cwact!=="reveal") cwFocus(); return; }
  if(d.su){ SU.sel = +d.su; suDraw(); return; }
  if(d.sun){ suInput(+d.sun); return; }
  if(d.suact){ suAct(d.suact); return; }
  if(d.mode){ if(prefs.mode!==d.mode){ prefs.mode=d.mode; save(); view.overlay=null; renderOverlay(); render(); scrollTo(0,0); } return; }
  if("roundup" in d){ view.backTo=null; view.overlay="roundup"; renderOverlay(); return; }
  if("saved" in d){ view.backTo=null; view.overlay="saved"; renderOverlay(); return; }
  if(d.bul){ if(d.bul==="play") bulPlay(); else if(d.bul==="next") bulNext(); else bulStop(); return; }
  if("settings" in d){ view.overlay="settings"; renderOverlay(); return; }
  if("close" in d){ closeOverlay(); return; }
  if(d.open){ openStory(d.open); return; }
  if(d.react){ if(view.overlay==="roundup") bulStop(); react(d.react, +d.v, {toggle:true}); if(view.overlay) renderOverlay(); render(); return; }
  if(d.swipe){ if(d.swipe==="up") commitUp(); else commit(+d.swipe); return; }
  if(d.keep){ toggleSave(d.keep); render(); if(view.overlay) renderOverlay(); return; }
  if(d.unsave){ unsave(d.unsave); save(); if(view.overlay==="story" && !getStory(view.story)){ view.overlay = view.backTo||null; view.backTo=null; } render(); renderOverlay(); toast("Removed from saved for later"); return; }
  if("reswipe" in d){ const k=new Set(todaySaved().map(e=>e.id)); prefs.swiped.ids=prefs.swiped.ids.filter(x=>!k.has(x)); save(); view.overlay=null; renderOverlay(); render(); scrollTo(0,0); return; }
  if("undo" in d){ undo(); return; }
  if("restart" in d){ prefs.swiped.ids=[]; save(); if(prefs.mode!=="swipe"){ prefs.mode="swipe"; } view.overlay=null; renderOverlay(); render(); scrollTo(0,0); toast("Back to story 1. Your likes and saves are kept"); return; }
  if(d.more){ view.more[d.more]=true; render(); return; }
  if(d.min){ prefs.min=d.min; save(); render(); renderOverlay(); return; }
  if(d.up!==undefined||d.down!==undefined){ const i=+(d.up??d.down), j=d.up!==undefined?i-1:i+1; [prefs.order[i],prefs.order[j]]=[prefs.order[j],prefs.order[i]]; save(); render(); renderOverlay(); return; }
  if(d.remove){ prefs.order=prefs.order.filter(x=>x!==d.remove); save(); render(); renderOverlay(); return; }
  if(d.add){ prefs.order.push(d.add); save(); render(); renderOverlay(); return; }
  if("resettaste" in d){ prefs.taste={sec:{},sub:{}}; prefs.react.map={}; save(); syncTaste(); render(); renderOverlay(); toast("Your feed has been reset"); return; }
});
document.addEventListener("keydown", e=>{
  if(e.key==="Escape" && (document.getElementById("coach") || document.getElementById("tour"))){ endCoach("start"); return; }
  if(document.getElementById("tour")){ if(e.key==="ArrowRight") tourGo(tourI+1); else if(e.key==="ArrowLeft") tourGo(tourI-1); return; }
  if(e.key==="Escape" && view.overlay){ closeOverlay(); return; }
  if(document.getElementById("coach")) return;
  if(view.overlay || prefs.mode!=="swipe") return;
  if(e.target.matches("input,textarea")) return;
  if(e.key==="ArrowRight"){ e.preventDefault(); commit(1); }
  else if(e.key==="ArrowLeft"){ e.preventDefault(); commit(-1); }
  else if(e.key==="ArrowUp"){ e.preventDefault(); commitUp(); }
  else if((e.key==="Enter"||e.key===" ") && e.target.id==="topcard"){ e.preventDefault(); openStory(e.target.dataset.id); }
});

/* ---------- feedback + taste sync (invited testers signed in to Claude) ---------- */
const FEEDBACK_URL = "";
const FBQ = [
  {id:"useful", q:"How useful was today's edition?", opts:[["1","1 Meh"],["2","2"],["3","3"],["4","4"],["5","5 Love it"]]},
  {id:"trust", q:"Did you trust the verified facts?", opts:[["yes","Yes"],["partly","Partly"],["no","No"]]},
  {id:"mode", q:"Which did you prefer?", opts:[["scroll","Scroll"],["swipe","Swipe"],["both","Both"]]},
  {id:"pay", q:"Would you pay £39 a year (about £3.25 a month) for it?", opts:[["yes","Yes"],["maybe","Maybe"],["no","No"]]}
];
let fb = {status:"loading", useful:"", trust:"", mode:"", pay:"", wish:"", note:""};
let fbDb = null, fbUid = null, fbDoc = {}, writeChain = Promise.resolve(), tasteT;
function writeDoc(next){ writeChain = writeChain.then(()=>fbDb.doc("feedback/"+fbUid).set(next)).then(()=>{ fbDoc = next; }); return writeChain; }
function syncTaste(){
  if(!fbDb || !fbUid) return;
  clearTimeout(tasteT);
  tasteT = setTimeout(()=>{
    const next = Object.assign({}, fbDoc, {taste:prefs.taste, reactions:Object.assign({}, fbDoc.reactions||{}, {[String(EDITION.issue)]:prefs.react.map}), modeUsed:prefs.mode, updated:new Date().toISOString()});
    writeDoc(next).catch(()=>{});
  }, 1500);
}
async function initFeedback(){
  try{
    if(!window.claude || !window.claude.use){ fb.status="readonly"; render(); return; }
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    const uid = user ? await user.id() : null;
    const can = user ? await user.can("data.write") : null;
    if(!db || !uid || can===false){ fb.status="readonly"; render(); return; }
    fbDb = db; fbUid = uid;
    const snap = await db.doc("feedback/"+uid).get();
    fbDoc = snap.exists ? JSON.parse(JSON.stringify(snap.data())) : {};
    const mine = fbDoc.editions && fbDoc.editions[String(EDITION.issue)];
    if(mine){ Object.assign(fb, {useful:mine.useful||"", trust:mine.trust||"", mode:mine.mode||"", pay:mine.pay||"", wish:mine.wish||""}); fb.status="sent"; }
    else fb.status="ready";
    syncTaste();
  }catch(e){ fb.status="readonly"; }
  render();
}
function feedbackSection(){
  const head = `<h2>Tell us what you think</h2>`;
  const ext = FEEDBACK_URL ? `<a class="pill solid" href="${esc(FEEDBACK_URL)}" target="_blank" rel="noopener">Open the feedback form</a>` : "";
  if(fb.status==="loading") return `<section class="feedback" id="feedback">${head}<p class="muted">Loading…</p></section>`;
  if(fb.status==="readonly") return `<section class="feedback" id="feedback">${head}<p class="muted">${FEEDBACK_URL ? "Four quick taps. Under a minute." : "Feedback is open to invited testers. Ask the person who shared this link to invite you."}</p>${ext}</section>`;
  const qs = FBQ.map(f=>`<fieldset class="fbq"><legend>${esc(f.q)}</legend><div class="fbopts">${f.opts.map(([v,l])=>`<label for="fb-${f.id}-${v}"><input type="radio" name="fb-${f.id}" id="fb-${f.id}-${v}" value="${v}" ${fb[f.id]===v?"checked":""}><span>${esc(l)}</span></label>`).join("")}</div></fieldset>`).join("");
  return `<section class="feedback" id="feedback">${head}
    <p class="muted">${fb.status==="sent" ? "Thanks, your answers for today are saved. Change them any time." : "Four quick taps. Under a minute."}</p>
    <form id="fb-form" novalidate>${qs}
      <fieldset class="fbq"><legend><label for="fb-wish">What would make you open it every day? (optional)</label></legend><textarea id="fb-wish" rows="2" maxlength="1000">${esc(fb.wish)}</textarea></fieldset>
      <div class="fbfoot"><button class="pill solid" type="submit" id="fb-submit">${fb.status==="sent"?"Update my answers":"Send"}</button>${fb.note?`<span class="muted" role="status">${esc(fb.note)}</span>`:""}</div>
    </form>${ext?`<p class="muted">Prefer a separate form? ${ext}</p>`:""}</section>`;
}
async function submitFeedback(){
  if(!fbDb || !fbUid) return;
  if(!fb.useful || !fb.pay){ fb.note="Answer the first and last questions, please."; render(); document.getElementById("fb-submit")?.focus(); return; }
  fb.note="Saving…"; render();
  const answers = {useful:fb.useful, trust:fb.trust, mode:fb.mode, pay:fb.pay, wish:fb.wish.trim(), date:EDITION.date, topics:prefs.order.slice(), minGrade:prefs.min, at:new Date().toISOString()};
  const next = Object.assign({}, fbDoc, {editions:Object.assign({}, fbDoc.editions||{}, {[String(EDITION.issue)]:answers}), taste:prefs.taste, updated:answers.at});
  try{ await writeDoc(next); fb.status="sent"; fb.note="Saved. Thank you."; }
  catch(e){ if(e && e.code==="invalid_argument"){ fb.status="readonly"; fb.note=""; } else fb.note="Couldn't save just now. Try again in a moment."; }
  render(); document.getElementById("fb-submit")?.focus();
}
document.addEventListener("submit", e=>{ if(e.target.id==="fb-form"){ e.preventDefault(); submitFeedback(); } });
document.addEventListener("input", e=>{ if(e.target.id==="fb-wish") fb.wish=e.target.value; });
document.addEventListener("change", e=>{ const t=e.target; if(t.name && t.name.startsWith("fb-")) fb[t.name.slice(3)]=t.value; });

render();
initFeedback();
setTimeout(()=>{ if(!prefs.tour) showTour(); }, 500);

</script>
